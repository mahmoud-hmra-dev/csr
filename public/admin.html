<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CSR Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      margin:0;padding:0;background:#f3f4f6;color:#111827;
    }
    header{background:#1f2937;color:white;padding:12px 18px;}
    main{padding:16px;max-width:1100px;margin:0 auto;}
    h1{margin:0;font-size:20px;}
    .card{background:white;border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:0 10px 25px rgba(15,23,42,0.08);}
    label{font-size:13px;}
    input{padding:6px 8px;border-radius:6px;border:1px solid #d1d5db;font-size:13px;}
    button{padding:8px 14px;border-radius:999px;border:0;background:#2563eb;color:white;font-weight:600;cursor:pointer;font-size:13px;}
    table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
    th,td{border:1px solid #e5e7eb;padding:6px 4px;text-align:left;}
    th{background:#f9fafb;}
    .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;}
    .muted{font-size:12px;color:#6b7280;}
    .badge{padding:2px 6px;border-radius:999px;font-size:11px;background:#e5e7eb;}
  </style>
</head>
<body>
  <header>
    <h1>CSR Admin Dashboard</h1>
    <div style="position:absolute; top:10px; right:14px;">
    <select id="langSelect" style="padding:6px 10px;border:1px solid #cbd5e1;border-radius:999px;">
      <option value="en">English</option>
      <option value="ar">???????</option>
    </select>
  </div>
</header>
  <main>
    <div class="card" id="loginCard">
      <h3>Admin login</h3>
      <div class="row">
        <label>Email <input id="email" value="admin@example.com" /></label>
        <label>Password <input id="password" type="password" value="admin123" /></label>
        <button id="loginBtn">Login</button>
      </div>
      <div class="muted">Default admin is created from init.sql (admin@example.com / admin123).</div>
    </div>

    <div id="content" style="display:none;">
      <div class="card">
        <h3>Budget rules</h3>
        <div class="row">
          <label>NGO large threshold (USD)
            <input id="ngoThreshold" type="number" min="0" step="1" />
          </label>
          <label>Corporate large threshold (USD)
            <input id="corpThreshold" type="number" min="0" step="1" />
          </label>
          <button id="saveRules">Save</button>
        </div>
      </div>

      <div class="card">
        <h3>Submissions</h3>
        <table id="tbl">
          <thead>
            <tr>
              <th>ID</th>
              <th>User</th>
              <th>Org type</th>
              <th>Submitted at</th>
              <th>Lang</th>
              <th>Answers (JSON)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = "";

    let token = null;

    async function login(){
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const res = await fetch(API_BASE + "/api/login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ email, password })
      });
      const data = await res.json();
      if(!data.ok){ alert("Login failed: " + (data.error || "")); return; }
      token = data.token;
      document.getElementById("loginCard").style.display = "none";
      document.getElementById("content").style.display = "block";
      loadRules();
      loadResponses();
    }

    async function loadRules(){
      const res = await fetch(API_BASE + "/api/admin/budget-rules", {
        headers:{ "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      if(!data.ok){ alert("Failed to load rules"); return; }
      const rules = data.rules || data.rule || {};
      document.getElementById("ngoThreshold").value = rules.ngo_threshold ?? '';
      document.getElementById("corpThreshold").value = rules.corporate_threshold ?? '';
    }

    async function saveRules(){
      const ngo = Number(document.getElementById("ngoThreshold").value || 0);
      const corp = Number(document.getElementById("corpThreshold").value || 0);
      const res = await fetch(API_BASE + "/api/admin/budget-rules", {
        method:"PUT",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + token
        },
        body:JSON.stringify({ ngo_threshold: ngo, corporate_threshold: corp })
      });
      const data = await res.json();
      if(!data.ok){ alert("Failed to save rules"); return; }
      alert("Rules updated");
    }

    async function loadResponses(){
      // Fetch questions to map IDs to display text
      let qMap = {};
      try{
        const qRes = await fetch(API_BASE + "/api/questions");
        const qData = await qRes.json();
        const all = (qData.sections || []).flatMap(s => s.questions || []);
        all.forEach(q => { qMap[q.id] = { en: q.text_en || '', ar: q.text_ar || '' }; });
      }catch(e){ /* ignore mapping errors; we will fall back to raw keys */ }

      const res = await fetch(API_BASE + "/api/admin/responses", {
        headers:{ "Authorization":"Bearer " + token }
      });
      const data = await res.json();
      if(!data.ok){ alert("Failed to load responses"); return; }
      const tbody = document.querySelector("#tbl tbody");
      tbody.innerHTML = "";

      function renderAnswersCell(row){
        let ans = row.answers;
        if (typeof ans === 'string'){
          try{ ans = JSON.parse(ans); }catch(e){ ans = {}; }
        }
        const entries = Object.entries(ans || {});
        if (!entries.length) return '<span class="muted">(no answers)</span>';
        const lang = row.lang || 'en';
        let html = '<table style="width:100%;border-collapse:collapse;font-size:11px;">';
        entries.forEach(([k,v]) => {
          const qText = (qMap[k] && (qMap[k][lang] || qMap[k].en)) || k;
          const val = Array.isArray(v) ? v.join(', ') : (typeof v === 'object' ? JSON.stringify(v) : String(v));
          html += `<tr><td style="border:1px solid #eee;padding:2px 4px;width:45%;">${qText}</td><td style="border:1px solid #eee;padding:2px 4px;">${val}</td></tr>`;
        });
        html += '</table>';
        return html;
      }

      data.items.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.id}</td>
          <td>${row.email || ""}<br><span class="badge">${row.org_kind || ""} / ${row.org_size || ""}</span></td>
          <td>${row.organization_type}</td>
          <td>${row.submitted_at}</td>
          <td>${row.lang}</td>
          <td>${renderAnswersCell(row)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById("loginBtn").onclick = login;
    document.getElementById("saveRules").onclick = saveRules;
  </script>
  <script>
  (function(){
    const saved = localStorage.getItem("lang");
    const lang = saved === "ar" ? "ar" : "en";
    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
    const sel = document.getElementById("langSelect");
    if (sel){ sel.value = lang; sel.addEventListener("change", e=>{
      const v = e.target.value === "ar" ? "ar" : "en";
      localStorage.setItem("lang", v);
      document.documentElement.setAttribute("lang", v);
      document.documentElement.setAttribute("dir", v === "ar" ? "rtl" : "ltr");
      location.reload();
    });}
  })();
  </script>
  <script>
  const translations = {
    en: {
      title: "CSR Admin Dashboard",
      adminLogin: "Admin login",
      email: "Email",
      password: "Password",
      login: "Login",
      defaultAdmin: "Default admin is created from init.sql (admin@example.com / admin123).",
      budgetRules: "Budget rules",
      saveRules: "Save rules",
      failedLogin: "Login failed",
      failedLoadRules: "Failed to load rules",
      rulesUpdated: "Rules updated",
      failedSaveRules: "Failed to save rules",
      failedLoadResponses: "Failed to load responses"
    },
    ar: {
      title: "لوحة إدارة المسؤولية الاجتماعية",
      adminLogin: "تسجيل دخول المسؤول",
      email: "البريد الإلكتروني",
      password: "كلمة المرور",
      login: "تسجيل الدخول",
      defaultAdmin: "تم إنشاء المسؤول الافتراضي من init.sql (admin@example.com / admin123).",
      budgetRules: "قواعد الميزانية",
      saveRules: "حفظ القواعد",
      failedLogin: "فشل تسجيل الدخول",
      failedLoadRules: "فشل تحميل القواعد",
      rulesUpdated: "تم تحديث القواعد",
      failedSaveRules: "فشل حفظ القواعد",
      failedLoadResponses: "فشل تحميل الردود"
    }
  };

  function translatePage() {
    const lang = document.documentElement.getAttribute("lang") || "en";
    const t = translations[lang];

    document.title = t.title;
    document.querySelector("header h1").textContent = t.title;
    document.querySelector("#loginCard h3").textContent = t.adminLogin;
    const labels = document.querySelectorAll("#loginCard label");
    labels[0].textContent = t.email;
    labels[1].textContent = t.password;
    document.querySelector("#loginBtn").textContent = t.login;
    document.querySelector(".muted").textContent = t.defaultAdmin;
    document.querySelector("#content .card:nth-child(1) h3").textContent = t.budgetRules;
    document.querySelector("#saveRules").textContent = t.saveRules;
  }

  document.addEventListener("DOMContentLoaded", translatePage);
  </script>
</body>
</html>
