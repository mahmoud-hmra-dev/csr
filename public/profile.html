<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>User Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      margin:0;padding:0;background:#f3f4f6;color:#111827;
    }
    header{background:#111827;color:white;padding:12px 18px;}
    main{padding:16px;max-width:720px;margin:0 auto;}
    .card{background:white;border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:0 10px 25px rgba(15,23,42,0.08);}
    label{font-size:13px;display:block;margin-bottom:6px;}
    input{padding:6px 8px;border-radius:6px;border:1px solid #d1d5db;font-size:13px;width:100%;}
    button{padding:8px 14px;border-radius:999px;border:0;background:#2563eb;color:white;font-weight:600;cursor:pointer;font-size:13px;}
    .muted{font-size:12px;color:#6b7280;}
    .row{display:flex;flex-direction:column;gap:8px;}
  </style>
</head>
<body>
  <header>
    <h1>User profile</h1>
    <div style="position:absolute; top:10px; right:14px;">
    <select id="langSelect" style="padding:6px 10px;border:1px solid #cbd5e1;border-radius:999px;">
      <option value="en">English</option>
      <option value="ar">???????</option>
    </select>
  </div>
</header>
  <main>
    <div class="card" id="loginCard">
      <h3>Login</h3>
      <div class="row">
        <label>Email
          <input id="email" />
        </label>
        <label>Password
          <input id="password" type="password" />
        </label>
        <button id="loginBtn">Login</button>
      </div>
      <p class="muted">Use the same credentials you used when registering before answering the survey.</p>
    </div>

    <div class="card" id="profileCard" style="display:none;">
      <h3>Your profile</h3>
      <div class="row">
        <label>Name
          <input id="name" />
        </label>
        <label>New password (optional)
          <input id="newPassword" type="password" />
        </label>
        <div class="muted">Org kind / size: <span id="kindSize"></span></div>
      </div>

      <div class="row" style="margin-top:12px;">
        <h4>Organization details</h4>
        <label>Arabic name
          <input id="name_ar" />
        </label>
        <label>English/Company name
          <input id="name_en" />
        </label>
        <label>Country
          <input id="country" />
        </label>
        <label>Registration number
          <input id="registration_number" />
        </label>
        <label>Phone
          <input id="phone" />
        </label>
        <label>Website
          <input id="website" />
        </label>
        <label>NGO causal activities / CSR cause
          <input id="ngo_causal_activities" />
        </label>
        <label>Sustainable Development Goal
          <input id="sdg" />
        </label>
        <label>Area of assistance / Interests
          <input id="area_of_assistance" />
        </label>
        <label>How did you know about us?
          <input id="heard_about" />
        </label>
        <label>Number of employment (incl. volunteers)
          <input id="employees" type="number" min="0" />
        </label>
        <label>Annual budget / revenue (USD)
          <input id="annual_budget" type="number" min="0" />
        </label>
        <h4>Contact</h4>
        <label>Contact first name
          <input id="contact_first_name" />
        </label>
        <label>Contact last name
          <input id="contact_last_name" />
        </label>
        <label>Contact mobile
          <input id="contact_mobile" />
        </label>
      </div>

      <div class="row" style="margin-top:12px;">
        <button id="saveBtn">Save changes</button>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = "";
    let token = localStorage.getItem("csr_token") || null;

    async function login(){
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const res = await fetch(API_BASE + "/api/login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ email, password })
      });
      const data = await res.json();
      if(!data.ok){ alert("Login failed"); return; }
      token = data.token;
      localStorage.setItem("csr_token", token);
      loadProfile();
    }

    async function loadProfile(){
      if(!token){
        document.getElementById("loginCard").style.display = "block";
        document.getElementById("profileCard").style.display = "none";
        return;
      }
      const res = await fetch(API_BASE + "/api/me", {
        headers:{ "Authorization":"Bearer " + token }
      });
      const data = await res.json();
      if(!data.ok){
        alert("Session expired, please login again.");
        localStorage.removeItem("csr_token");
        token = null;
        document.getElementById("loginCard").style.display = "block";
        document.getElementById("profileCard").style.display = "none";
        return;
      }
      document.getElementById("loginCard").style.display = "none";
      document.getElementById("profileCard").style.display = "block";
      document.getElementById("name").value = data.user.name || "";
      document.getElementById("kindSize").textContent = `${data.user.org_kind} / ${data.user.org_size} (${data.user.org_type})`;
      const ex = data.user.extra || {};
      document.getElementById("name_ar").value = ex.arabic_name || "";
      document.getElementById("name_en").value = ex.english_name || data.user.name || "";
      document.getElementById("country").value = ex.country || "";
      document.getElementById("registration_number").value = ex.registration_number || "";
      document.getElementById("phone").value = ex.phone || "";
      document.getElementById("website").value = ex.website || "";
      document.getElementById("ngo_causal_activities").value = ex.ngo_causal_activities || ex.csr_cause || "";
      document.getElementById("sdg").value = ex.sdg || "";
      document.getElementById("area_of_assistance").value = ex.area_of_assistance || "";
      document.getElementById("heard_about").value = ex.heard_about || "";
      document.getElementById("employees").value = (ex.employees != null ? ex.employees : "");
      document.getElementById("annual_budget").value = data.user.annual_budget != null ? data.user.annual_budget : "";
      document.getElementById("contact_first_name").value = ex.contact_first_name || "";
      document.getElementById("contact_last_name").value = ex.contact_last_name || "";
      document.getElementById("contact_mobile").value = ex.contact_mobile || "";
    }

    async function saveProfile(){
      const name = document.getElementById("name").value;
      const newPassword = document.getElementById("newPassword").value;
      const extra = {
        arabic_name: document.getElementById("name_ar").value,
        english_name: document.getElementById("name_en").value,
        country: document.getElementById("country").value,
        registration_number: document.getElementById("registration_number").value,
        phone: document.getElementById("phone").value,
        website: document.getElementById("website").value,
        ngo_causal_activities: document.getElementById("ngo_causal_activities").value,
        sdg: document.getElementById("sdg").value,
        area_of_assistance: document.getElementById("area_of_assistance").value,
        heard_about: document.getElementById("heard_about").value,
        employees: document.getElementById("employees").value ? Number(document.getElementById("employees").value) : null,
        contact_first_name: document.getElementById("contact_first_name").value,
        contact_last_name: document.getElementById("contact_last_name").value,
        contact_mobile: document.getElementById("contact_mobile").value
      };
      const annualBudget = document.getElementById("annual_budget").value;
      const res = await fetch(API_BASE + "/api/me", {
        method:"PUT",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + token
        },
        body:JSON.stringify({
          name: name,
          password: newPassword || undefined,
          annualBudget: annualBudget === "" ? undefined : Number(annualBudget),
          extra
        })
      });
      const data = await res.json();
      if(!data.ok){ alert("Failed to save"); return; }
      alert("Profile updated");
      document.getElementById("newPassword").value = "";
      loadProfile();
    }

    document.getElementById("loginBtn").onclick = login;
    document.getElementById("saveBtn").onclick = saveProfile;

    loadProfile();
  </script>
  <script>
  (function(){
    const saved = localStorage.getItem("lang");
    const lang = saved === "ar" ? "ar" : "en";
    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
    const sel = document.getElementById("langSelect");
    if (sel){ sel.value = lang; sel.addEventListener("change", e=>{
      const v = e.target.value === "ar" ? "ar" : "en";
      localStorage.setItem("lang", v);
      document.documentElement.setAttribute("lang", v);
      document.documentElement.setAttribute("dir", v === "ar" ? "rtl" : "ltr");
      location.reload();
    });}
  })();
  </script>
  <script>
  const translations = {
    en: {
      title: "User Profile",
      login: "Login",
      email: "Email",
      password: "Password",
      useCredentials: "Use the same credentials you used when registering before answering the survey.",
      profile: "Your profile",
      name: "Name",
      newPassword: "New password (optional)",
      orgDetails: "Org kind / size:",
      saveChanges: "Save changes",
      failedLogin: "Login failed",
      sessionExpired: "Session expired, please login again.",
      failedSave: "Failed to save",
      profileUpdated: "Profile updated"
    },
    ar: {
      title: "????? ??????",
      login: "????? ??????",
      email: "?????? ??????????",
      password: "???? ??????",
      useCredentials: "?????? ??? ?????? ?????? ???? ???? ??? ??? ??????? ??? ?????????.",
      profile: "???? ??????",
      name: "?????",
      newPassword: "???? ???? ????? (???????)",
      orgDetails: "???/??? ???????:",
      saveChanges: "??? ?????????",
      failedLogin: "??? ????? ??????",
      sessionExpired: "????? ??????? ???? ????? ?????? ??????.",
      failedSave: "??? ?????",
      profileUpdated: "?? ????? ????? ??????"
    }
  };

  function translatePage() {
    const lang = document.documentElement.getAttribute("lang") || "en";
    const t = translations[lang];

    document.title = t.title;
    document.querySelector("header h1").textContent = t.title;
    document.querySelector("#loginCard h3").textContent = t.login;
    const labels = document.querySelectorAll("#loginCard label");
    labels[0].textContent = t.email;
    labels[1].textContent = t.password;
    document.querySelector("#loginCard .muted").textContent = t.useCredentials;
    document.querySelector("#profileCard h3").textContent = t.profile;
    const profileLabels = document.querySelectorAll("#profileCard label");
    profileLabels[0].textContent = t.name;
    profileLabels[1].textContent = t.newPassword;
    document.querySelector("#kindSize").previousSibling.textContent = t.orgDetails;
    document.querySelector("#saveBtn").textContent = t.saveChanges;
  }

  document.addEventListener("DOMContentLoaded", translatePage);
</script>
</body>
</html>
