<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSR Assessment Portal</title>
  <style>
    :root{
      --bg:#f3f6fb;
      --bg-soft:#ffffff;
      --border:#d0d7e6;
      --text:#0f172a;
      --muted:#64748b;
      --primary:#2563eb;
      --primary-soft:#e0ecff;
      --primary-dark:#1e40af;
      --danger:#dc2626;
      --shadow-soft:0 18px 40px rgba(15,23,42,0.08);
    }
    *{box-sizing:border-box;}
    html,body{height:100%;margin:0;padding:0;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic","Noto Sans",sans-serif;
      background:radial-gradient(circle at top left,#dbeafe,#eef2ff 40%,#f9fafb 75%);
      color:var(--text);
    }
    a{text-decoration:none;color:inherit;}
    button{font-family:inherit;}
    .top-nav{
      position:sticky;top:0;z-index:50;
      background:rgba(248,250,252,0.94);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(226,232,240,0.9);
    }
    .nav-inner{
      max-width:1120px;margin:0 auto;
      padding:10px 18px;
      display:flex;align-items:center;justify-content:space-between;gap:14px;
    }
    .brand{
      display:flex;align-items:center;gap:10px;
    }
    .brand-icon{
      width:32px;height:32px;border-radius:12px;
      background:linear-gradient(135deg,#2563eb,#38bdf8);
      box-shadow:0 8px 20px rgba(37,99,235,0.45);
    }
    .brand-title{font-weight:700;font-size:18px;}
    .nav-links{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    }
    .nav-link{
      padding:6px 12px;border-radius:999px;font-size:14px;
      color:var(--muted);cursor:pointer;border:1px solid transparent;
    }
    .nav-link.active{
      color:var(--primary-dark);
      background:var(--primary-soft);
      border-color:rgba(129,140,248,0.4);
    }
    .nav-link.primary{
      background:linear-gradient(135deg,#2563eb,#1d4ed8);
      color:#fff;
      box-shadow:0 10px 20px rgba(37,99,235,0.35);
    }
    .nav-link.primary:hover{filter:brightness(1.05);}
    .nav-user{
      font-size:13px;
      padding:4px 10px;
      border-radius:999px;
      background:white;
      border:1px solid var(--border);
      color:var(--muted);
    }

    main{
      min-height:calc(100vh - 80px);
    }
    .shell{
      max-width:1120px;margin:0 auto;padding:22px 18px 40px;
    }
    .grid-2{
      display:grid;
      grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);
      gap:22px;
    }
    .card{
      background:var(--bg-soft);
      border-radius:22px;
      border:1px solid var(--border);
      box-shadow:var(--shadow-soft);
      padding:20px 20px;
    }
    .hero-title{
      font-size:30px;
      font-weight:750;
      margin-bottom:10px;
      color:var(--primary-dark);
    }
    .hero-sub{
      font-size:15px;
      color:var(--muted);
      margin-bottom:16px;
    }
    .hero-cta{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .tag{
      display:inline-flex;align-items:center;gap:6px;
      padding:4px 10px;border-radius:999px;
      background:#e0f2fe;
      color:#0369a1;font-size:12px;
    }
    .tag span.icon{font-size:14px;}
    .muted{color:var(--muted);font-size:13px;}
    .stat-row{
      display:flex;gap:18px;margin-top:16px;flex-wrap:wrap;
    }
    .stat{
      padding:10px 12px;border-radius:16px;background:#f8fafc;
      border:1px dashed #cbd5f5;font-size:12px;
    }
    .stat strong{display:block;font-size:18px;margin-bottom:2px;color:var(--primary-dark);}

    .form-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:12px 16px;
    }
    /* Make section headers inside forms span full width */
    .form-grid > .section-title{ grid-column: 1 / -1; margin-top:6px; }
    .field{
      display:flex;flex-direction:column;gap:4px;font-size:13px;
    }
    .field label{font-weight:500;}
    .field span.helper{font-size:11px;color:var(--muted);}
    .field input,.field select{
      border-radius:12px;border:1px solid #d0d7e6;
      padding:8px 10px;font-size:13px;
      outline:none;background:#f9fbff;
    }
    .field input:focus,.field select:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 1px rgba(37,99,235,0.25);
      background:#fff;
    }
    .section-title{
      font-size:19px;font-weight:650;margin-bottom:6px;color:var(--primary-dark);
    }
    .section-sub{font-size:13px;color:var(--muted);margin-bottom:14px;}

    .btn{
      border-radius:999px;border:0;padding:9px 16px;font-size:14px;
      cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;
    }
    .btn-primary{
      background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;
      box-shadow:0 10px 22px rgba(37,99,235,0.35);
    }
    .btn-outline{
      background:#fff;border:1px solid var(--border);color:var(--text);
    }
    .btn-danger{
      background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;
    }
    .btn[disabled]{opacity:.6;cursor:not-allowed;box-shadow:none;}
    .tabs{
      display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;
    }
    .tab{
      padding:6px 12px;border-radius:999px;border:1px solid var(--border);
      font-size:13px;cursor:pointer;background:#f9fafb;color:var(--muted);
    }
    .tab.active{
      background:#2563eb;color:#fff;border-color:#2563eb;
    }

    .two-col{
      display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;
    }

    .q-card{
      margin-top:10px;
      padding:14px 14px;border-radius:16px;
      border:1px solid #e5e7eb;background:#f9fafb;
    }
    .q-title{font-size:15px;font-weight:600;margin-bottom:6px;}
    .opt{
      display:block;margin-top:7px;padding:8px 10px;border-radius:10px;
      border:1px solid #e5e7eb;background:#fff;cursor:pointer;font-size:13px;
    }
    .opt:hover{border-color:#c4d0f5;background:#eff6ff;}
    .opt input{margin-right:6px;}
    .survey-controls{
      display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;
    }
    .pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:4px 10px;border-radius:999px;background:#eff6ff;border:1px solid #bfdbfe;
      font-size:12px;color:#1d4ed8;
    }
    .progress-bar{
      width:100%;height:7px;border-radius:999px;background:#e5e7eb;overflow:hidden;margin-top:8px;
    }
    .progress-bar>div{
      height:100%;width:0;background:linear-gradient(90deg,#2563eb,#38bdf8);
      transition:width .25s ease;
    }

    .table{
      width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;
    }
    .table th,.table td{
      padding:6px 8px;border-bottom:1px solid #e5e7eb;text-align:left;
    }
    .table th{background:#f3f4ff;font-weight:600;font-size:12px;}
    .badge{
      display:inline-flex;align-items:center;justify-content:center;
      padding:2px 8px;border-radius:999px;font-size:11px;
    }
    .badge.outline{
      border:1px solid #c4b5fd;background:#ede9fe;color:#4c1d95;
    }
    .badge.dim{
      border:1px solid #cbd5e1;background:#f8fafc;color:#475569;
    }

    .toast{
      position:fixed;bottom:16px;right:16px;z-index:60;
      background:#0f172a;color:#e5e7eb;padding:10px 14px;border-radius:12px;
      font-size:13px;box-shadow:0 12px 30px rgba(15,23,42,0.5);
      display:flex;align-items:center;gap:8px;
    }
    .toast span.icon{font-size:16px;}
    .toast.error{background:#991b1b;}

    footer{
      border-top:1px solid rgba(226,232,240,0.9);
      background:rgba(248,250,252,0.95);
      padding:10px 18px;
      font-size:12px;
      color:#94a3b8;
      text-align:center;
    }

    @media (max-width:900px){
      .grid-2,.two-col{grid-template-columns:minmax(0,1fr);}    
      .nav-inner{flex-wrap:wrap;}
    }
    @media (max-width:640px){
      .form-grid{ grid-template-columns: 1fr; }
      .card{ padding:16px; }
    }
  </style>
</head>

// Override translator with the new dictionary
t = function(key){
  const lang = state.lang || 'en';
  return (I18N[lang] && I18N[lang][key]) || key;
};
    function setAuth(token, user){
      state.token = token;
      state.user = user;
      if (token){
        localStorage.setItem("csr_token", token);
        localStorage.setItem("csr_user", JSON.stringify(user));
      } else {
        localStorage.removeItem("csr_token");
        localStorage.removeItem("csr_user");
      }
      renderNav();
    }

    function restoreAuth(){
      const t = localStorage.getItem("csr_token");
      const u = localStorage.getItem("csr_user");
      if (t && u){
        try{
          state.token = t;
          state.user = JSON.parse(u);
        }catch(e){
          state.token = null;
          state.user = null;
        }
      }
    }

    async function apiFetch(path, options={}){
      const opts = { ...options };
      opts.headers = opts.headers || {};
      if (!opts.headers["Content-Type"] && opts.method && opts.method !== "GET"){
        opts.headers["Content-Type"] = "application/json";
      }
      if (state.token){
        opts.headers["Authorization"] = "Bearer " + state.token;
      }
      const res = await fetch(path, opts);
      let data = {};
      try{ data = await res.json(); }catch(e){}
      if (!res.ok || data.ok === false){
        throw data;
      }
      return data;
    }

    function showToast(msg, isError=false){
      const old = document.getElementById("toast");
      if (old) old.remove();
      const div = document.createElement("div");
      div.id = "toast";
      div.className = "toast" + (isError ? " error" : "");
      const icon = document.createElement("span");
      icon.className = "icon";
      icon.textContent = isError ? "⚠" : "✓";
      const text = document.createElement("span");
      text.textContent = msg;
      div.appendChild(icon);
      div.appendChild(text);
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 4000);
    }

    async function ensureQuestionsLoaded(){
      if (state.survey.loaded) return;
      const data = await apiFetch("/api/questions");
      state.sections = data.sections || [];
      state.survey.loaded = true;
    }

    function userSections(){
      if (!state.user) return [];
      const orgType = state.user.org_type;
      const sections = (state.sections || []).map(sec => {
        const qs = (sec.questions || []).filter(q => {
          if (!q.organization_type || q.organization_type === "all") return true;
          return q.organization_type === orgType;
        });
        return { ...sec, questions: qs };
      }).filter(sec => sec.questions.length > 0);
      return sections;
    }

    async function renderSurvey(root){
      if (!state.user){
        go("login");
        return;
      }
      root.innerHTML = "";
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="section-title">"+t("CSR questionnaire")+""</div>
        <div class="section-sub">"+t("Questions filtered")+""</div>
      `;
      root.appendChild(card);

      try{
        await ensureQuestionsLoaded();
      }catch(err){
        card.innerHTML += '<p class="muted">' + t("Failed to load questions.") + '</p>';
        return;
      }

      const sections = userSections();
      if (!sections.length){
        card.innerHTML += '<p class="muted">' + t("No sections available for your organization type yet.") + '</p>';
        return;
      }

      const totalSteps = sections.length;
      const step = Math.min(state.survey.sectionIndex + 1, totalSteps);

      const meta = document.createElement("div");
      meta.className = "pill";
      meta.textContent = t("Section") + " " + step + " " + t("of") + " " + totalSteps;
      card.appendChild(meta);

      const bar = document.createElement("div");
      bar.className = "progress-bar";
      const inner = document.createElement("div");
      inner.style.width = Math.round(step/totalSteps*100) + "%";
      bar.appendChild(inner);
      card.appendChild(bar);

      if (state.survey.sectionIndex >= sections.length){
        card.innerHTML += `
          <p style="margin-top:16px;">"+t("You reached the end")+"</p>
        `;
        const submitRow = document.createElement("div");
        submitRow.style.marginTop = "12px";
        const btnSubmit = document.createElement("button");
        btnSubmit.className = "btn btn-primary";
        btnSubmit.textContent = t("Submit answers");
        btnSubmit.addEventListener("click", async () => {
          try{
            const payload = {
              submittedAt: new Date().toISOString(),
              lang: state.lang,
              answers: state.survey.answers
            };
            const data = await apiFetch("/api/submit", {
              method:"POST",
              body: JSON.stringify(payload)
            });
            showToast("Responses submitted (id " + data.id + ").");
            state.survey.sectionIndex = 0;
            state.survey.answers = {};
            go("dashboard");
          }catch(err){
            showToast(err.error || "Submit failed.", true);
          }
        });
        submitRow.appendChild(btnSubmit);
        card.appendChild(submitRow);
        return;
      }

      const sec = sections[state.survey.sectionIndex];
      const title = sec.title_en || "Section";
      const subTitle = sec.title_ar ? ("<span class='muted'>" + sec.title_ar + "</span>") : "";
      card.innerHTML += `
        <h3 style="margin-top:14px;margin-bottom:4px;">${title}</h3>
        ${subTitle}
      `;

      (sec.questions || []).forEach(q => {
        const qBox = document.createElement("div");
        qBox.className = "q-card";
        const text = (state.lang === 'ar' ? (q.text_ar || q.text_en) : (q.text_en || q.text_ar)) || "";
        qBox.innerHTML = '<div class="q-title">'+ text +'</div>';
        const key = q.id;
        const isMulti = q.type === "multiple";

        if (q.choices && q.choices.length){
          q.choices.forEach(choice => {
            const label = document.createElement("label");
            label.className = "opt";
            const value = (state.lang === 'ar' ? (choice.ar || choice.en) : (choice.en || choice.ar));
            const textChoice = (state.lang === 'ar' ? (choice.ar || choice.en) : (choice.en || choice.ar));
            let checked = false;
            if (isMulti){
              const arr = Array.isArray(state.survey.answers[key]) ? state.survey.answers[key] : [];
              checked = arr.includes(value);
            } else {
              checked = state.survey.answers[key] === value;
            }
            label.innerHTML = '<input type="'+(isMulti?'checkbox':'radio')+'" name="'+key+(isMulti?'[]':'')+'" '+(checked?'checked':'')+'> '+textChoice;
            label.addEventListener("click", () => {
              if (isMulti){
                const arr = Array.isArray(state.survey.answers[key]) ? state.survey.answers[key] : [];
                const exists = arr.includes(value);
                state.survey.answers[key] = exists ? arr.filter(v => v !== value) : arr.concat(value);
              } else {
                state.survey.answers[key] = value;
              }
            });
            qBox.appendChild(label);
          });
        } else {
          const input = document.createElement("input");
          input.type = "text";
          input.value = state.survey.answers[key] || "";
          input.placeholder = "Your answer";
          input.addEventListener("input", e => {
            state.survey.answers[key] = e.target.value;
          });
          qBox.appendChild(input);
        }

        card.appendChild(qBox);
      });

      const controls = document.createElement("div");
      controls.className = "survey-controls";
      const left = document.createElement("div");
      const right = document.createElement("div");
      const back = document.createElement("button");
      back.className = "btn btn-outline";
      back.textContent = "Back";
      back.disabled = state.survey.sectionIndex === 0;
      back.addEventListener("click", () => {
        if (state.survey.sectionIndex > 0){
          state.survey.sectionIndex -= 1;
          render();
        }
      });
      left.appendChild(back);

      const next = document.createElement("button");
      next.className = "btn btn-primary";
      next.textContent = state.survey.sectionIndex === sections.length-1 ? "Finish section" : "Next section";
      next.addEventListener("click", () => {
        state.survey.sectionIndex += 1;
        render();
      });
      right.appendChild(next);

      controls.appendChild(left);
      controls.appendChild(right);
      card.appendChild(controls);
    }

    async function renderAdmin(root){
      if (!state.user){
        go("login");
        return;
      }
      if (state.user.role !== "admin"){
        root.innerHTML = "<div class='card'><div class='section-title'>Forbidden</div><p class='muted'>You must be an admin to access this page.</p></div>";
        return;
      }
      root.innerHTML = "";
      const grid = document.createElement("div");
      grid.className = "two-col";

      const left = document.createElement("div");
      left.className = "card";
      left.innerHTML = `
        <div class="section-title">Budget thresholds</div>
        <div class="section-sub">Define when NGOs and corporates are considered large vs small.</div>
        <form id="rules-form" class="form-grid">
          <div class="field">
            <label>NGO large threshold (USD)</label>
            <input name="ngo_threshold" type="number" min="0" />
          </div>
          <div class="field">
            <label>Corporate large threshold (USD)</label>
            <input name="corporate_threshold" type="number" min="0" />
          </div>
        </form>
        <div style="margin-top:16px;">
          <button class="btn btn-primary" id="rules-save">Save rules</button>
        </div>
      `;
      grid.appendChild(left);

      const right = document.createElement("div");
      right.className = "card";
      right.innerHTML = `
        <div class="section-title">Recent responses</div>
        <div class="section-sub">Last 200 submissions with linked organizations.</div>
        <div id="responses-table"></div>
      `;
      grid.appendChild(right);
      root.appendChild(grid);

      try{
        const { rules } = await apiFetch("/api/admin/budget-rules");
        const form = document.getElementById("rules-form");
        form.ngo_threshold.value = rules.ngo_threshold;
        form.corporate_threshold.value = rules.corporate_threshold;
      }catch(err){
        showToast(err.error || "Failed to load rules.", true);
      }

      document.getElementById("rules-save").addEventListener("click", async () => {
        const form = document.getElementById("rules-form");
        try{
          await apiFetch("/api/admin/budget-rules", {
            method:"PUT",
            body: JSON.stringify({
              ngo_threshold: form.ngo_threshold.value,
              corporate_threshold: form.corporate_threshold.value
            })
          });
          showToast("Budget rules updated.");
        }catch(err){
          showToast(err.error || "Could not update rules.", true);
        }
      });

      try{
        const data = await apiFetch("/api/admin/responses");
        const wrap = document.getElementById("responses-table");
        if (!data.items || !data.items.length){
          wrap.innerHTML = "<p class='muted'>No responses yet.</p>";
          return;
        }
        const table = document.createElement("table");
        table.className = "table";
        table.innerHTML = `
          <thead>
            <tr>
              <th>ID</th>
              <th>Submitted at</th>
              <th>User</th>
              <th>Org type</th>
              <th>Lang</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;
        const tbody = table.querySelector("tbody");
        data.items.forEach(r => {
          const tr = document.createElement("tr");
          const userLabel = (r.email || "-") + " (" + (r.org_kind || "-") + "/" + (r.org_size || "-") + ")";
          tr.innerHTML = `
            <td>${r.id}</td>
            <td>${r.submitted_at}</td>
            <td>${userLabel}</td>
            <td>${r.organization_type}</td>
            <td>${r.lang}</td>
          `;
          tbody.appendChild(tr);
        });
        wrap.innerHTML = "";
        wrap.appendChild(table);
      }catch(err){
        showToast(err.error || "Failed to load responses.", true);
      }
    }

    function render(){
      renderNav();
      const app = document.getElementById("app");
      if (!app) return;
      if (state.route === "landing"){
        renderLanding(app);
      } else if (state.route === "login"){
        renderLogin(app);
      } else if (state.route === "register"){
        renderRegister(app);
      } else if (state.route === "dashboard"){
        renderDashboard(app);
      } else if (state.route === "survey"){
        renderSurvey(app);
      } else if (state.route === "admin"){
        renderAdmin(app);
      } else {
        renderLanding(app);
      }
    }

    document.getElementById("year").textContent = new Date().getFullYear();
    restoreAuth();
    window.addEventListener("hashchange", syncRouteFromHash);
    syncRouteFromHash();
  </script>
